<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Locked-down CSP. The renderer never loads anything remote: no CDN, no
      fonts, no analytics. 'unsafe-inline' for styles is required by the CSS-in-
      JS custom properties the theme sets on :root; scripts have no such licence.
      connect-src and img-src both allow only the loopback bridge — the same
      exception, for two different kinds of request: connect-src covers the
      WebSocket itself, img-src covers a camera surface's polled snapshots,
      served over plain HTTP by that same bridge (see transport/server.py's
      `/camera/` route).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: http://127.0.0.1:* http://localhost:*;
               font-src 'self';
               connect-src 'self' ws://127.0.0.1:* ws://localhost:*;
               object-src 'none';
               base-uri 'none';
               form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>N.O.V.A.</title>
    <script type="module" crossorigin src="/app/assets/index-CzwM3AbT.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-ZvNB4Xmr.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
