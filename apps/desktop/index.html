<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Locked-down CSP. The renderer never loads anything remote: no CDN, no
      fonts, no analytics. 'unsafe-inline' for styles is required by the CSS-in-
      JS custom properties the theme sets on :root; scripts have no such licence.
      connect-src allows only the loopback bridge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self' ws://127.0.0.1:* ws://localhost:*;
               object-src 'none';
               base-uri 'none';
               form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>N.O.V.A.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
